<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: #1e2a3a;
    color: #f2f4f7;
    font-family: system-ui, "Microsoft YaHei", sans-serif;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .stage {
    width: min(960px, 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  svg { display: block; width: 100%; height: auto; }
  button {
    font: inherit;
    padding: 8px 22px;
    border: 0;
    border-radius: 999px;
    background: #f4a340;
    color: #1e2a3a;
    cursor: pointer;
  }
  button:hover { background: #f7b866; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* 喉囊随骑行轻微晃动 */
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: wobble 0.9s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.12); }
  }

  /* 眨眼 */
  .eye {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 4s infinite;
  }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }

  /* 车后风线 */
  .speed line { animation: whoosh 0.8s linear infinite; }
  .speed line:nth-child(2) { animation-delay: -0.3s; }
  .speed line:nth-child(3) { animation-delay: -0.55s; }
  @keyframes whoosh {
    0% { transform: translateX(0); opacity: 0; }
    20% { opacity: 0.9; }
    100% { transform: translateX(-70px); opacity: 0; }
  }

  .paused .pouch,
  .paused .eye,
  .paused .speed line { animation-play-state: paused; }
</style>
</head>
<body>
<h1>鹈鹕骑自行车</h1>
<div class="stage" id="stage">
<svg viewBox="0 0 800 450" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">鹈鹕骑自行车</title>
  <desc id="svgDesc">一只长着橙色长喙的白色鹈鹕在乡间道路上蹬自行车前进，云朵、山丘和路面标线向后滚动。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec4e6"/>
      <stop offset="1" stop-color="#fde6c2"/>
    </linearGradient>
    <g id="cloudSet" fill="#ffffff" opacity="0.9">
      <ellipse cx="90" cy="80" rx="44" ry="16"/>
      <ellipse cx="120" cy="68" rx="28" ry="18"/>
      <ellipse cx="380" cy="120" rx="52" ry="14"/>
      <ellipse cx="402" cy="108" rx="26" ry="15"/>
      <ellipse cx="610" cy="60" rx="38" ry="13"/>
      <ellipse cx="632" cy="50" rx="22" ry="13"/>
    </g>
    <!-- 山丘首尾高度和切线一致，平移 800 后可无缝拼接 -->
    <path id="hillFarShape" fill="#a7cfa8" d="M 0 300 C 60 300 120 240 200 240 C 280 240 320 290 400 290 C 480 290 520 230 620 230 C 720 230 740 300 800 300 L 800 386 L 0 386 Z"/>
    <path id="hillNearShape" fill="#73b07a" d="M 0 330 C 80 330 140 280 230 280 C 320 280 360 335 460 335 C 560 335 620 290 700 290 C 760 290 780 330 800 330 L 800 386 L 0 386 Z"/>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#2b3440" stroke-width="7"/>
      <circle r="50" fill="none" stroke="#c9d1da" stroke-width="2"/>
      <g stroke="#c9d1da" stroke-width="1.5">
        <line x1="50" y1="0" x2="-50" y2="0"/>
        <line x1="43.3" y1="25" x2="-43.3" y2="-25"/>
        <line x1="25" y1="43.3" x2="-25" y2="-43.3"/>
        <line x1="0" y1="50" x2="0" y2="-50"/>
        <line x1="-25" y1="43.3" x2="25" y2="-43.3"/>
        <line x1="-43.3" y1="25" x2="43.3" y2="-25"/>
      </g>
      <circle r="6" fill="#4a5563"/>
      <circle cy="-50" r="3.5" fill="#f4a340"/>
    </g>
  </defs>

  <!-- 背景：天空、太阳、云、山丘、道路（云和山丘平移做视差） -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="660" cy="92" r="36" fill="#ffd166"/>
  <g id="clouds"><use href="#cloudSet"/><use href="#cloudSet" x="800"/></g>
  <g id="hillsFar"><use href="#hillFarShape"/><use href="#hillFarShape" x="800"/></g>
  <g id="hillsNear"><use href="#hillNearShape"/><use href="#hillNearShape" x="800"/></g>
  <rect y="385" width="800" height="65" fill="#5b6470"/>
  <rect y="383" width="800" height="4" fill="#3e4550"/>
  <g id="dashes" stroke="#eef1f5" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="420" x2="50" y2="420"/>
    <line x1="100" y1="420" x2="150" y2="420"/>
    <line x1="200" y1="420" x2="250" y2="420"/>
    <line x1="300" y1="420" x2="350" y2="420"/>
    <line x1="400" y1="420" x2="450" y2="420"/>
    <line x1="500" y1="420" x2="550" y2="420"/>
    <line x1="600" y1="420" x2="650" y2="420"/>
    <line x1="700" y1="420" x2="750" y2="420"/>
    <line x1="800" y1="420" x2="850" y2="420"/>
  </g>
  <ellipse cx="395" cy="388" rx="125" ry="6" fill="#000000" opacity="0.18"/>

  <!-- 身后风线 -->
  <g class="speed" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="190" x2="270" y2="190"/>
    <line x1="212" y1="226" x2="262" y2="226"/>
    <line x1="232" y1="262" x2="266" y2="262"/>
  </g>


  <!-- 远侧腿与曲柄（在车架后方），坐标由脚本逐帧计算 -->
  <g id="farSide">
    <line id="thighFar" stroke="#c5ccd4" stroke-width="11" stroke-linecap="round"/>
    <line id="shinFar" stroke="#c97b2c" stroke-width="5" stroke-linecap="round"/>
    <path id="footFar" d="M -7 -3 L 10 -7 L 15 -1 L 10 1 Z" fill="#c97b2c"/>
    <line id="armFar" stroke="#7a8592" stroke-width="5" stroke-linecap="round"/>
    <rect id="pedalFar" width="16" height="4" rx="1.5" fill="#5b6470"/>
  </g>

  <!-- 车轮（后轮带飞轮） -->
  <g id="wheelRear" transform="translate(300 330)">
    <use href="#wheel"/>
    <circle r="8" fill="none" stroke="#7a8592" stroke-width="3" stroke-dasharray="3 2.2"/>
  </g>
  <g id="wheelFront" transform="translate(490 330)"><use href="#wheel"/></g>

  <!-- 链条：虚线偏移模拟链节移动 -->
  <g stroke="#3e4550" stroke-width="2.5" stroke-dasharray="4 2">
    <line id="chainTop" x1="390" y1="321" x2="300" y2="322"/>
    <line id="chainBottom" x1="390" y1="349" x2="300" y2="338"/>
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="#d6453d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 330 L 390 335 L 374 250"/>
    <path d="M 300 330 L 377 263"/>
    <path d="M 376 262 L 467 257"/>
    <path d="M 390 335 L 471 272"/>
  </g>
  <line x1="465" y1="250" x2="476" y2="282" stroke="#b8352e" stroke-width="9" stroke-linecap="round"/>
  <line x1="475" y1="278" x2="490" y2="330" stroke="#9aa4af" stroke-width="5" stroke-linecap="round"/>
  <path d="M 466 252 L 470 238 Q 462 230 452 234" fill="none" stroke="#3e4550" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="452" cy="234" r="4.5" fill="#2b3440"/>
  <line x1="374" y1="252" x2="372" y2="243" stroke="#9aa4af" stroke-width="5"/>
  <path d="M 350 241 Q 372 234 392 242 L 388 248 Q 370 245 354 247 Z" fill="#2b3440"/>

  <!-- 齿盘 -->
  <g id="chainring" transform="translate(390 335)">
    <circle r="14" fill="#c9d1da" stroke="#4a5563" stroke-width="3" stroke-dasharray="3 2.5"/>
    <g stroke="#4a5563" stroke-width="2">
      <line x1="-11" y1="0" x2="11" y2="0"/>
      <line x1="0" y1="-11" x2="0" y2="11"/>
    </g>
    <circle r="5" fill="#4a5563"/>
  </g>

  <!-- 鹈鹕身体（脚本给整组加轻微上下颠簸） -->
  <g id="bird">
    <path d="M 345 205 L 316 195 L 322 211 L 314 226 L 350 222 Z" fill="#e4e9ed" stroke="#c5ccd4" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="385" cy="205" rx="52" ry="36" transform="rotate(-18 385 205)" fill="#f7f9fa" stroke="#c5ccd4" stroke-width="2"/>
    <path d="M 416 186 C 440 166 418 140 445 122" fill="none" stroke="#c5ccd4" stroke-width="26" stroke-linecap="round"/>
    <path d="M 416 186 C 440 166 418 140 445 122" fill="none" stroke="#f7f9fa" stroke-width="22" stroke-linecap="round"/>
    <path d="M 437 106 Q 430 92 441 96 Q 445 86 451 101" fill="#f6e7a9" stroke="#e2cf85" stroke-width="1.5"/>
    <circle cx="447" cy="120" r="17" fill="#f7f9fa" stroke="#c5ccd4" stroke-width="2"/>
    <path class="pouch" d="M 461 126 L 545 138 Q 525 172 487 163 Q 465 155 461 126 Z" fill="#f7b866" stroke="#e08c2a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 458 112 L 546 130 Q 558 133 552 142 L 546 139 L 460 128 Z" fill="#f4a340" stroke="#e08c2a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="466" y1="119" x2="536" y2="133" stroke="#e08c2a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="452" cy="115" r="5.5" fill="#ffffff" stroke="#c5ccd4" stroke-width="1"/>
    <circle class="eye" cx="453" cy="115" r="3.2" fill="#1e2a3a"/>
  </g>

  <!-- 近侧曲柄与腿 -->
  <g id="nearSide">
    <line id="armNear" stroke="#9aa4af" stroke-width="5" stroke-linecap="round"/>
    <rect id="pedalNear" width="16" height="4" rx="1.5" fill="#3e4550"/>
    <line id="thighNear" stroke="#dfe5ea" stroke-width="14" stroke-linecap="round"/>
    <line id="shinNear" stroke="#f4a340" stroke-width="5" stroke-linecap="round"/>
    <path id="footNear" d="M -8 -3 L 11 -8 L 17 -1 L 11 2 Z" fill="#f4a340" stroke="#e08c2a" stroke-width="1" stroke-linejoin="round"/>
  </g>

  <!-- 翅膀搭在车把上，和身体一起颠簸 -->
  <g id="birdWing">
    <path d="M 360 196 Q 395 172 428 196 Q 446 212 456 230 Q 452 241 442 238 Q 410 230 376 224 Q 352 216 360 196 Z" fill="#e4e9ed" stroke="#c5ccd4" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 372 206 Q 400 200 425 214 M 378 216 Q 404 212 432 224" fill="none" stroke="#c5ccd4" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 436 214 Q 450 222 457 231 Q 452 241 441 238 Z" fill="#2b3440"/>
  </g>
</svg>
</div>
<button id="toggle" type="button" aria-pressed="false">暂停</button>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fx = (n) => n.toFixed(2);
  const setLine = (el, x1, y1, x2, y2) => {
    el.setAttribute('x1', fx(x1));
    el.setAttribute('y1', fx(y1));
    el.setAttribute('x2', fx(x2));
    el.setAttribute('y2', fx(y2));
  };

  // 几何参数（SVG 坐标）
  const CRANK = { x: 390, y: 335 };
  const CRANK_LEN = 22;
  const THIGH = 64;
  const SHIN = 70;
  const HIP_NEAR = { x: 378, y: 226 };
  const HIP_FAR = { x: 372, y: 224 };
  const WHEEL_R = 55;
  const SPEED = 230;      // 地面速度 px/s
  const GEAR = 8 / 14;    // 飞轮半径 / 齿盘半径

  const el = {
    stage: $('stage'), toggle: $('toggle'),
    wheelRear: $('wheelRear'), wheelFront: $('wheelFront'), chainring: $('chainring'),
    chainTop: $('chainTop'), chainBottom: $('chainBottom'),
    bird: $('bird'), wing: $('birdWing'),
    clouds: $('clouds'), hillsFar: $('hillsFar'), hillsNear: $('hillsNear'), dashes: $('dashes')
  };
  const near = { arm: $('armNear'), pedal: $('pedalNear'), thigh: $('thighNear'), shin: $('shinNear'), foot: $('footNear') };
  const far = { arm: $('armFar'), pedal: $('pedalFar'), thigh: $('thighFar'), shin: $('shinFar'), foot: $('footFar') };

  // 两圆求交得到膝盖位置，取朝车头方向的解
  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const len = Math.hypot(dx, dy) || 1;
    const d = Math.min(Math.max(len, Math.abs(THIGH - SHIN) + 0.01), THIGH + SHIN - 0.01);
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
    const ux = dx / len;
    const uy = dy / len;
    return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
  }

  function updateLeg(parts, hip, angle) {
    const px = CRANK.x + CRANK_LEN * Math.cos(angle);
    const py = CRANK.y + CRANK_LEN * Math.sin(angle);
    setLine(parts.arm, CRANK.x, CRANK.y, px, py);
    parts.pedal.setAttribute('x', fx(px - 8));
    parts.pedal.setAttribute('y', fx(py - 2));
    const ankle = { x: px, y: py - 4 };
    const knee = solveKnee(hip, ankle);
    setLine(parts.thigh, hip.x, hip.y, knee.x, knee.y);
    setLine(parts.shin, knee.x, knee.y, ankle.x, ankle.y);
    parts.foot.setAttribute('transform', `translate(${fx(ankle.x)} ${fx(ankle.y + 1)})`);
  }

  const scroll = (node, offset, period) =>
    node.setAttribute('transform', `translate(${fx(-(offset % period))} 0)`);

  let distance = 0;

  function render() {
    const wheelAngle = distance / WHEEL_R;
    const crankAngle = wheelAngle * GEAR;
    const wheelDeg = (wheelAngle * 180 / Math.PI) % 360;
    const crankDeg = (crankAngle * 180 / Math.PI) % 360;

    el.wheelRear.setAttribute('transform', `translate(300 330) rotate(${fx(wheelDeg)})`);
    el.wheelFront.setAttribute('transform', `translate(490 330) rotate(${fx(wheelDeg)})`);
    el.chainring.setAttribute('transform', `translate(390 335) rotate(${fx(crankDeg)})`);

    const chainShift = (crankAngle * 14) % 6;
    el.chainTop.style.strokeDashoffset = fx(chainShift);
    el.chainBottom.style.strokeDashoffset = fx(-chainShift);

    // 每踩一脚身体起伏一次
    const bob = Math.sin(crankAngle * 2) * 1.6;
    el.bird.setAttribute('transform', `translate(0 ${fx(bob)})`);
    el.wing.setAttribute('transform', `translate(0 ${fx(bob * 0.6)})`);

    updateLeg(far, { x: HIP_FAR.x, y: HIP_FAR.y + bob }, crankAngle + Math.PI);
    updateLeg(near, { x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, crankAngle);

    scroll(el.clouds, distance * 0.08, 800);
    scroll(el.hillsFar, distance * 0.25, 800);
    scroll(el.hillsNear, distance * 0.5, 800);
    scroll(el.dashes, distance, 100);
  }


  // 主循环：按真实时间推进，切换标签页回来不会跳帧
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduceMotion;
  let last = null;

  function frame(now) {
    if (last !== null && !paused) {
      const dt = Math.min((now - last) / 1000, 0.05);
      distance += SPEED * dt;
      render();
    }
    last = now;
    requestAnimationFrame(frame);
  }

  function setPaused(value) {
    paused = value;
    el.stage.classList.toggle('paused', paused);
    el.toggle.textContent = paused ? '继续' : '暂停';
    el.toggle.setAttribute('aria-pressed', String(paused));
  }

  el.toggle.addEventListener('click', () => setPaused(!paused));
  setPaused(paused);
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
